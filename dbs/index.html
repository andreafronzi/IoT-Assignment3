<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Water Control Dashboard (DBS)</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 25px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        .card-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .val {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent);
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .badge-online { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        .badge-offline { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--accent); color: #0f172a; }
        .btn-secondary { background: #334155; color: var(--text); }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        .slider-container { margin-top: 15px; }
        input[type=range] { width: 100%; accent-color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <h1>💧 Smart Water Control Dashboard (DBS)</h1>
        <div class="grid">
            <div class="card">
                <div class="card-title">Livello Acqua (TMS)</div>
                <div class="val" id="waterLevel">-- cm</div>
                <div style="margin-top:10px;">TMS Status: <span id="tmsStatus" class="badge badge-offline">DISCONNECTED</span></div>
            </div>
            <div class="card">
                <div class="card-title">Modalit&agrave; Sistema</div>
                <div class="val" id="systemMode">--</div>
                <div class="btn-group">
                    <button class="btn-primary" onclick="setMode('AUTOMATIC')">AUTOMATIC</button>
                    <button class="btn-secondary" onclick="setMode('MANUAL')">MANUAL</button>
                </div>
            </div>
            <div class="card">
                <div class="card-title">Apertura Valvola (WCS)</div>
                <div class="val" id="valveOpening">-- %</div>
                <div>WCS Status: <span id="wcsStatus" class="badge badge-offline">DISCONNECTED</span></div>
                <div class="slider-container">
                    <label style="font-size: 0.85rem;">Controllo Manuale Valvola:</label>
                    <input type="range" id="valveSlider" min="0" max="100" value="0" onchange="setValve(this.value)">
                </div>
            </div>
        </div>
    </div>
    <script>
        const API_HOST = window.location.origin;

        async function updateStatus() {
            try {
                const res = await fetch(API_HOST + '/api/status');
                const data = await res.json();
                document.getElementById('waterLevel').innerText = data.waterLevel.toFixed(2) + ' cm';
                document.getElementById('systemMode').innerText = data.mode;
                document.getElementById('valveOpening').innerText = data.currentValveOpening + ' %';
                document.getElementById('tmsStatus').innerText = data.tmsConnected ? 'ONLINE' : 'OFFLINE';
                document.getElementById('tmsStatus').className = 'badge ' + (data.tmsConnected ? 'badge-online' : 'badge-offline');
                document.getElementById('wcsStatus').innerText = data.wcsConnected ? 'ONLINE' : 'OFFLINE';
                document.getElementById('wcsStatus').className = 'badge ' + (data.wcsConnected ? 'badge-online' : 'badge-offline');
            } catch (e) { console.error(e); }
        }

        async function setMode(mode) {
            await fetch(API_HOST + '/api/mode?mode=' + mode, { method: 'POST' });
            updateStatus();
        }

        async function setValve(val) {
            await fetch(API_HOST + '/api/valve?value=' + val, { method: 'POST' });
            updateStatus();
        }

        setInterval(updateStatus, 1000);
        updateStatus();
    </script>
</body>
</html>
