<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Tank Monitoring - DBS</title>
    <!-- Include Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #007bff;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --text-dark: #333333;
            --text-muted: #6c757d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .dashboard {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card-full {
            grid-column: span 2;
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 0;
        }

        h2 {
            margin-top: 0;
            color: var(--text-dark);
            font-size: 1.2rem;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            font-size: 1.1rem;
        }

        .status-AUTOMATIC { background-color: var(--success); }
        .status-MANUAL { background-color: var(--warning); color: #000; }
        .status-UNCONNECTED { background-color: var(--danger); }
        .status-NOT-AVAILABLE { background-color: var(--text-muted); }

        .stat-value {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary);
            margin: 10px 0;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        
        button:hover { opacity: 0.8; }

        .btn-auto { background-color: var(--success); color: white; }
        .btn-manual { background-color: var(--warning); color: black; }

        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #ccc;
        }
        
        .slider-container.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        input[type=range] {
            width: 100%;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
            .card-full { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <h1>💧 Smart Tank Monitoring (DBS)</h1>
    <p style="color: var(--text-muted);">Real-time monitoring and control dashboard</p>

    <div class="dashboard">
        <!-- Status Card -->
        <div class="card">
            <h2>System Status</h2>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <span>Current Mode:</span>
                <span id="modeBadge" class="status-badge status-NOT-AVAILABLE">NOT AVAILABLE</span>
            </div>
            
            <div style="text-align: center;">
                <p style="margin: 0; color: var(--text-muted);">Valve Opening</p>
                <div id="valveValue" class="stat-value">-- %</div>
            </div>
        </div>

        <!-- Control Panel Card -->
        <div class="card">
            <h2>Control Panel</h2>
            <div class="controls">
                <div style="display: flex; gap: 10px;">
                    <button class="btn-auto" style="flex:1" onclick="setMode('AUTOMATIC')">Set AUTOMATIC</button>
                    <button class="btn-manual" style="flex:1" onclick="setMode('MANUAL')">Set MANUAL</button>
                </div>
                
                <div id="manualControls" class="slider-container disabled">
                    <label for="valveSlider">Manual Valve Control: <span id="sliderLabel">0%</span></label>
                    <input type="range" id="valveSlider" min="0" max="100" value="0" oninput="updateSliderLabel(this.value)" onchange="setValve(this.value)">
                </div>
            </div>
        </div>

        <!-- Graph Card -->
        <div class="card card-full">
            <h2>Rainwater Level Graph</h2>
            <canvas id="waterChart" height="100"></canvas>
        </div>
    </div>

    <script>
        // Chart.js Setup
        const ctx = document.getElementById('waterChart').getContext('2d');
        const waterChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Rainwater Level (cm)',
                    data: [],
                    borderColor: '#007bff',
                    backgroundColor: 'rgba(0, 123, 255, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                animation: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        suggestedMax: 50
                    },
                    x: {
                        display: true // Show time labels
                    }
                }
            }
        });

        // Store the last known state so we can send all fields in POST
        let lastState = {
            waterLevel: 0,
            mode: "NOT-AVAILABLE",
            valve: 0
        };

        function updateSliderLabel(val) {
            document.getElementById('sliderLabel').innerText = val + '%';
        }

        async function fetchSystemData() {
            try {
                const res = await fetch('/api/data');
                const data = await res.json();
                
                // Update our last known state
                lastState = data;

                // Update UI: Mode
                const badge = document.getElementById('modeBadge');
                badge.innerText = data.mode;
                badge.className = 'status-badge status-' + data.mode;

                // Update UI: Valve
                document.getElementById('valveValue').innerText = data.valve + ' %';
                
                // Enable/disable slider based on mode
                const manualControls = document.getElementById('manualControls');
                const slider = document.getElementById('valveSlider');
                
                if (data.mode === 'MANUAL') {
                    manualControls.classList.remove('disabled');
                    if (document.activeElement !== slider) {
                        slider.value = data.valve;
                        updateSliderLabel(data.valve);
                    }
                } else {
                    manualControls.classList.add('disabled');
                    slider.value = data.valve;
                    updateSliderLabel(data.valve);
                }

                // Update Chart with the new single value
                const now = new Date().toLocaleTimeString();
                
                // Add new data point
                waterChart.data.labels.push(now);
                waterChart.data.datasets[0].data.push(data.waterLevel);
                
                // Keep only the last 10 points on the chart
                if (waterChart.data.labels.length > 10) {
                    waterChart.data.labels.shift();
                    waterChart.data.datasets[0].data.shift();
                }
                waterChart.update();

            } catch (err) {
                console.error("Error fetching data", err);
                const badge = document.getElementById('modeBadge');
                badge.innerText = "NOT-AVAILABLE";
                badge.className = 'status-badge status-NOT-AVAILABLE';
            }
        }

        // Control Actions
        async function setMode(mode) {
            lastState.mode = mode;
            await sendPostData(lastState);
            fetchSystemData(); // Immediate UI update
        }

        async function setValve(val) {
            lastState.valve = parseInt(val);
            await sendPostData(lastState);
            fetchSystemData();
        }

        async function sendPostData(payload) {
            try {
                await fetch('/api/data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.error("Error posting data", err);
            }
        }

        // Polling loop every 500ms
        setInterval(fetchSystemData, 500);
        
        // Initial fetch
        fetchSystemData();
    </script>
</body>
</html>
